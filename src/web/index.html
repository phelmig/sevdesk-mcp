<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SevDesk API Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0f11;
    --surface: #16171b;
    --surface-2: #1c1d22;
    --border: #2a2b31;
    --border-active: #3d3e46;
    --text: #c8c9cf;
    --text-dim: #6e7079;
    --text-bright: #ecedf2;
    --accent: #c4a35a;
    --accent-dim: #8a7340;
    --green: #5a9e6f;
    --red: #b55454;
    --blue: #5a7fb5;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'DM Sans', sans-serif;
    --radius: 3px;
  }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 13px;
    line-height: 1.5;
  }

  /* ── Top Bar ── */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    height: 44px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .topbar-title {
    font-family: var(--mono);
    font-weight: 700;
    font-size: 13px;
    color: var(--accent);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .topbar-title::before {
    content: '';
    width: 8px;
    height: 8px;
    background: var(--accent);
    display: inline-block;
  }

  .topbar-auth {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .topbar-auth label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .topbar-auth input {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 11px;
    padding: 4px 8px;
    width: 200px;
    border-radius: var(--radius);
    outline: none;
    transition: border-color 0.15s;
  }

  .topbar-auth input:focus {
    border-color: var(--accent-dim);
  }

  .topbar-auth input::placeholder { color: var(--text-dim); }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-dim);
    transition: background 0.3s;
  }

  .status-dot.active { background: var(--green); }

  /* ── Tabs ── */
  .tabs {
    display: flex;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 20px;
    gap: 0;
  }

  .tab {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 500;
    color: var(--text-dim);
    padding: 10px 16px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    user-select: none;
  }

  .tab:hover { color: var(--text); }

  .tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  /* ── Panels ── */
  .panel {
    display: none;
    padding: 20px;
    max-width: 960px;
    animation: fadeIn 0.15s ease;
  }

  .panel.active { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .panel-header {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-bottom: 16px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }

  /* ── Form Elements ── */
  .field-row {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
    align-items: flex-end;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex: 1;
  }

  .field label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .field input, .field select, .field textarea {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-bright);
    font-family: var(--mono);
    font-size: 12px;
    padding: 8px 10px;
    border-radius: var(--radius);
    outline: none;
    transition: border-color 0.15s;
    width: 100%;
  }

  .field input:focus, .field select:focus, .field textarea:focus {
    border-color: var(--accent-dim);
  }

  .field input::placeholder { color: var(--text-dim); }

  .field textarea {
    resize: vertical;
    min-height: 240px;
    line-height: 1.6;
  }

  .btn {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    padding: 8px 20px;
    border: 1px solid var(--accent-dim);
    background: transparent;
    color: var(--accent);
    cursor: pointer;
    border-radius: var(--radius);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    transition: all 0.15s;
    white-space: nowrap;
    height: fit-content;
  }

  .btn:hover {
    background: var(--accent);
    color: var(--bg);
  }

  .btn:active { transform: scale(0.97); }

  .btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .btn:disabled:hover {
    background: transparent;
    color: var(--accent);
  }

  /* ── Results ── */
  .result {
    margin-top: 16px;
    min-height: 40px;
  }

  .result-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    font-family: var(--mono);
    font-size: 12px;
  }

  .result-card .label {
    font-size: 10px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 2px;
  }

  .result-card .value {
    color: var(--text-bright);
    font-weight: 500;
  }

  .result-card .row {
    display: flex;
    gap: 32px;
    padding: 6px 0;
  }

  .result-card .row + .row {
    border-top: 1px solid var(--border);
  }

  .result-error {
    color: var(--red);
    font-family: var(--mono);
    font-size: 12px;
    padding: 10px 14px;
    background: rgba(181, 84, 84, 0.08);
    border: 1px solid rgba(181, 84, 84, 0.2);
    border-radius: var(--radius);
  }

  .result-json {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 400px;
    overflow-y: auto;
  }

  .spinner {
    display: inline-block;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
  }

  .spinner::after {
    content: '';
    animation: dots 1.2s steps(3) infinite;
  }

  @keyframes dots {
    0% { content: '.'; }
    33% { content: '..'; }
    66% { content: '...'; }
  }

  /* ── Table ── */
  .data-table {
    width: 100%;
    border-collapse: collapse;
    font-family: var(--mono);
    font-size: 11px;
  }

  .data-table th {
    text-align: left;
    font-size: 10px;
    font-weight: 600;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky;
    top: 0;
  }

  .data-table td {
    padding: 7px 12px;
    border-bottom: 1px solid var(--border);
    color: var(--text);
  }

  .data-table tr:hover td {
    background: var(--surface-2);
  }

  .data-table .num {
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .status-badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 2px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .status-100 { background: rgba(196, 163, 90, 0.15); color: var(--accent); }
  .status-200 { background: rgba(90, 127, 181, 0.15); color: var(--blue); }
  .status-1000 { background: rgba(90, 158, 111, 0.15); color: var(--green); }

  .table-wrap {
    max-height: 480px;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }

  .empty-state {
    text-align: center;
    padding: 32px;
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 11px;
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-title">SevDesk API</div>
  <div class="topbar-auth">
    <label>Bearer Token</label>
    <input type="password" id="apiKey" placeholder="api key" spellcheck="false">
    <div class="status-dot" id="statusDot"></div>
  </div>
</div>

<div class="tabs">
  <div class="tab active" data-tab="search">Search Contact</div>
  <div class="tab" data-tab="create">Create Invoice</div>
  <div class="tab" data-tab="list">List Invoices</div>
</div>

<!-- Search Contact -->
<div class="panel active" id="panel-search">
  <div class="panel-header">Contact Search · <span id="searchModeLabel">All Matches</span></div>
  <div class="field-row">
    <div class="field">
      <label>Company Name</label>
      <input type="text" id="searchQuery" placeholder="e.g. Wohnstätten Siegen">
    </div>
    <div class="field" style="flex:0 0 auto; min-width: 130px;">
      <label>Mode</label>
      <select id="searchMode">
        <option value="all">All matches</option>
        <option value="best">Best match</option>
      </select>
    </div>
    <button class="btn" id="searchBtn">Search</button>
  </div>
  <div class="result" id="searchResult"></div>
</div>

<!-- Create Invoice -->
<div class="panel" id="panel-create">
  <div class="panel-header">Create Invoice</div>
  <div style="display:flex;gap:0;margin-bottom:14px;">
    <button class="btn" id="modeText" style="border-radius:var(--radius) 0 0 var(--radius);">Free Text</button>
    <button class="btn" id="modeJson" style="border-radius:0 var(--radius) var(--radius) 0;opacity:0.4;">JSON</button>
  </div>
  <div id="freeTextMode">
    <div class="field">
      <label>Paste invoice text (German)</label>
      <textarea id="invoiceText" placeholder="z.B. Rechnung an Mustermann GmbH, Musterstr. 1, 12345 Berlin. 5 Lizenzen Omnifact Pro à 16€/Monat für 12 Monate ab 01.03.2026. E-Mail: rechnung@mustermann.de"></textarea>
    </div>
    <div style="margin-top:12px;">
      <button class="btn" id="parseBtn">Parse with AI</button>
    </div>
  </div>
  <div id="jsonMode" style="display:none;">
    <div class="field">
      <label>Quote JSON</label>
      <textarea id="quoteJson"></textarea>
    </div>
    <div style="margin-top:12px;display:flex;gap:8px;">
      <button class="btn" id="createBtn">Create Invoice</button>
      <button class="btn" id="backToText" style="opacity:0.6;">Back to Text</button>
    </div>
  </div>
  <div class="result" id="createResult"></div>
</div>

<!-- List Invoices -->
<div class="panel" id="panel-list">
  <div class="panel-header">Invoice Listing</div>
  <div class="field-row">
    <div class="field">
      <label>Start Date</label>
      <input type="date" id="listStart">
    </div>
    <div class="field">
      <label>End Date</label>
      <input type="date" id="listEnd">
    </div>
    <div class="field">
      <label>Contact (optional)</label>
      <input type="text" id="listContact" placeholder="company name">
    </div>
    <div class="field">
      <label>Status</label>
      <select id="listStatus">
        <option value="">All</option>
        <option value="100">Draft</option>
        <option value="200">Open</option>
        <option value="1000">Paid</option>
      </select>
    </div>
    <button class="btn" id="listBtn">Fetch</button>
  </div>
  <div class="result" id="listResult"></div>
</div>

<script>
const $ = (sel) => document.querySelector(sel);

// ── API Key persistence ──
const apiKeyInput = $('#apiKey');
const statusDot = $('#statusDot');

apiKeyInput.value = localStorage.getItem('sevdesk_api_key') || '';
updateDot();

apiKeyInput.addEventListener('input', () => {
  localStorage.setItem('sevdesk_api_key', apiKeyInput.value);
  updateDot();
});

function updateDot() {
  statusDot.classList.toggle('active', apiKeyInput.value.length > 0);
}

function getKey() { return apiKeyInput.value; }

// ── Tabs ──
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    $(`#panel-${tab.dataset.tab}`).classList.add('active');
  });
});

// ── Helpers ──
async function api(method, path, body) {
  const opts = {
    method,
    headers: {
      'Authorization': `Bearer ${getKey()}`,
      'Content-Type': 'application/json',
    },
  };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(`/api${path}`, opts);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

function showLoading(el) { el.innerHTML = '<span class="spinner">Working</span>'; }
function showError(el, msg) { el.innerHTML = `<div class="result-error">${esc(msg)}</div>`; }
function showJson(el, obj) { el.innerHTML = `<div class="result-json">${esc(JSON.stringify(obj, null, 2))}</div>`; }
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

const STATUS_LABELS = { '100': 'Draft', '200': 'Open', '1000': 'Paid' };

// ── Search Contacts ──
$('#searchMode').addEventListener('change', () => {
  const label = $('#searchMode').value === 'best' ? 'Best Match (AI)' : 'All Matches';
  $('#searchModeLabel').textContent = label;
});

$('#searchBtn').addEventListener('click', async () => {
  const q = $('#searchQuery').value.trim();
  if (!q) return;
  const el = $('#searchResult');
  const mode = $('#searchMode').value;
  showLoading(el);
  try {
    if (mode === 'best') {
      const data = await api('GET', `/contacts/search?q=${encodeURIComponent(q)}`);
      const c = data.contact;
      el.innerHTML = `
        <div class="result-card">
          <div class="row">
            <div><div class="label">Name</div><div class="value">${esc(c.name)}</div></div>
            <div><div class="label">ID</div><div class="value">${esc(c.id)}</div></div>
            ${c.customerNumber ? `<div><div class="label">Customer #</div><div class="value">${esc(c.customerNumber)}</div></div>` : ''}
          </div>
        </div>`;
    } else {
      const data = await api('GET', `/contacts?q=${encodeURIComponent(q)}`);
      const contacts = data.contacts;
      if (!contacts.length) {
        el.innerHTML = '<div class="empty-state">No contacts found</div>';
        return;
      }
      el.innerHTML = `
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>Name</th><th>ID</th><th>Customer #</th><th>Description</th></tr></thead>
            <tbody>${contacts.map(c => `
              <tr>
                <td>${esc(c.name)}</td>
                <td>${esc(c.id)}</td>
                <td>${esc(c.customerNumber || '—')}</td>
                <td>${esc(c.description || '—')}</td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>`;
    }
  } catch (e) { showError(el, e.message); }
});

$('#searchQuery').addEventListener('keydown', e => { if (e.key === 'Enter') $('#searchBtn').click(); });

// ── Create Invoice ──
function setCreateMode(mode) {
  const isText = mode === 'text';
  $('#freeTextMode').style.display = isText ? 'block' : 'none';
  $('#jsonMode').style.display = isText ? 'none' : 'block';
  $('#modeText').style.opacity = isText ? '1' : '0.4';
  $('#modeJson').style.opacity = isText ? '0.4' : '1';
}

$('#modeText').addEventListener('click', () => setCreateMode('text'));
$('#modeJson').addEventListener('click', () => setCreateMode('json'));
$('#backToText').addEventListener('click', () => setCreateMode('text'));

$('#parseBtn').addEventListener('click', async () => {
  const text = $('#invoiceText').value.trim();
  if (!text) return;
  const el = $('#createResult');
  showLoading(el);
  try {
    const data = await api('POST', '/invoices/from-text', { text });
    $('#quoteJson').value = JSON.stringify(data.parsed, null, 2);
    setCreateMode('json');
    el.innerHTML = '<div class="result-json" style="color:var(--green);border-color:var(--green);padding:8px 12px;">Parsed successfully — review and click Create Invoice</div>';
  } catch (e) { showError(el, e.message); }
});

$('#createBtn').addEventListener('click', async () => {
  const el = $('#createResult');
  let body;
  try { body = JSON.parse($('#quoteJson').value); }
  catch { showError(el, 'Invalid JSON'); return; }
  showLoading(el);
  try {
    const data = await api('POST', '/invoices', body);
    showJson(el, data);
  } catch (e) { showError(el, e.message); }
});

// ── List Invoices ──
$('#listBtn').addEventListener('click', async () => {
  const el = $('#listResult');
  const params = new URLSearchParams();
  const start = $('#listStart').value;
  const end = $('#listEnd').value;
  const contact = $('#listContact').value.trim();
  const status = $('#listStatus').value;
  if (start) params.set('startDate', start);
  if (end) params.set('endDate', end);
  if (contact) params.set('contactQuery', contact);
  if (status) params.set('status', status);

  showLoading(el);
  try {
    const data = await api('GET', `/invoices?${params}`);
    const inv = data.invoices;
    if (!inv.length) {
      el.innerHTML = '<div class="empty-state">No invoices found</div>';
      return;
    }
    el.innerHTML = `
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr>
            <th>Invoice #</th><th>Contact</th><th>Status</th>
            <th class="num">Net</th><th class="num">Gross</th><th>Date</th>
          </tr></thead>
          <tbody>${inv.map(i => `
            <tr>
              <td><a href="${esc(i.url)}" target="_blank" style="color:var(--accent);text-decoration:none">${esc(i.invoiceNumber || '—')}</a></td>
              <td>${esc(i.contactName)}</td>
              <td><span class="status-badge status-${i.status}">${STATUS_LABELS[i.status] || i.status}</span></td>
              <td class="num">${fmt(i.sumNet)}</td>
              <td class="num">${fmt(i.sumGross)}</td>
              <td>${esc(i.invoiceDate?.split(' ')[0] || '')}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>`;
  } catch (e) { showError(el, e.message); }
});

function fmt(v) { return v != null ? parseFloat(v).toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €' : '—'; }

// ── Default dates: last 30 days ──
const now = new Date();
$('#listEnd').value = now.toISOString().split('T')[0];
const past = new Date(now); past.setDate(past.getDate() - 30);
$('#listStart').value = past.toISOString().split('T')[0];
</script>
</body>
</html>
